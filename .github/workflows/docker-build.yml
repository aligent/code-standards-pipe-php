name: Build and Push Docker Image

on:
  pull_request:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: PHP ${{ matrix.php-version }}${{ matrix.image.suffix }}
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4']
        image:
          # Full pipe image (last Dockerfile stage)
          - target: ''
            suffix: ''
          # Runtime-only image for CLI tools / IDE integrations
          - target: standards-runtime
            suffix: '-runtime'
    uses: aligent/workflows/.github/workflows/docker-build.yml@main
    with:
      image-name: aligent/code-standards-pipe-php
      target: ${{ matrix.image.target }}
      # Only main/staging publish; pull requests and manual runs on other branches just build
      push: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' }}
      build-args: |
        PHP_VERSION=${{ matrix.php-version }}
        ALPINE_VERSION=${{ vars.ALPINE_VERSION }}
      # Tags: 8.4, 8.4-runtime (main); 8.4-experimental, 8.4-runtime-experimental (staging)
      tags: |
        type=raw,value=${{ matrix.php-version }}${{ matrix.image.suffix }}${{ github.ref_name == 'staging' && '-experimental' || '' }}
      # Separate cache scope per matrix entry so builds don't overwrite each other's cache
      cache-from: type=gha,scope=php-${{ matrix.php-version }}${{ matrix.image.suffix }}
      cache-to: type=gha,mode=max,scope=php-${{ matrix.php-version }}${{ matrix.image.suffix }}
